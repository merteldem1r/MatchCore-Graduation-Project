# Checks every new commit message with the same script as the local git hook.
name: Commit messages

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check new commit messages
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            commits=$(git rev-list --no-merges "$PR_BASE..$PR_HEAD")
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            commits=$(git rev-list --no-merges "$BEFORE..$AFTER")
          else
            # New branch or force-push: only the latest commit can be checked reliably.
            commits=$(git rev-list --no-merges --max-count=1 "$AFTER")
          fi

          status=0
          for c in $commits; do
            git log -1 --format=%B "$c" > "$RUNNER_TEMP/msg"
            if ! sh .githooks/commit-msg "$RUNNER_TEMP/msg"; then
              echo "  ↳ in commit $c"
              status=1
            fi
          done
          [ "$status" -eq 0 ] && echo "✓ All new commit messages follow the format."
          exit "$status"
